# rss-digest instance config. One file per instance (e.g. /etc/rss-digest/carl_pro.toml).
# It holds passwords: chmod 600 it, owned by the rss-digest user.

# SQLite state for this instance. Keep it outside the vault; never share it between instances.
state_path = "/var/lib/rss-digest/carl_pro.db"

[freshrss]
url = "https://example.com/rss" # FreshRSS base URL (without /api/greader.php)
user = "carl_pro"
api_password = "..."            # FreshRSS > Profile > API password

[wallabag]
url = "https://example.com/wallabag"
client_id = "..."                    # Wallabag > API clients management
client_secret = "..."
username = "carl_pro"
password = "..."

[nextcloud]
url = "https://example.com/nextcloud"
user = "carl"
app_password = "..."                  # Nextcloud > Settings > Security > App passwords
vault_path = "RSS Vault"              # vault folder, relative to the user's files root

[llm]
base_url = "https://api.openai.com/v1" # any OpenAI-compatible endpoint
api_key = "..."
cheap_model = "gpt-4.1-mini"           # ranking and topic assignment
writer_model = "gpt-4.1"               # summaries and topic pages
max_tokens_per_run = 200000            # optional; the run stops cleanly when reached
# wiki_api_key = "..."                 # optional: a second key for topic pages, backlog and lint, so
# OpenRouter shows wiki and digest usage apart (Activity, filter by key)

[digest] # optional section
top_n = 20        # articles summarised
also_notable = 10 # titles listed under "Also notable"
explore = 5       # random titles from below the cut-off, under "Outside your usual"
